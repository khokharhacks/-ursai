services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ursai
      POSTGRES_USER: ursai
      POSTGRES_PASSWORD: ursai_local_only
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ursai -d ursai']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ursai-postgres:/var/lib/postgresql/data

volumes:
  ursai-postgres:
